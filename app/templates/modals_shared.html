<!-- Shared Modals for MyFoil -->

<!-- Game Details Modal -->
<div class="modal modal-game-details" id="gameDetailsModal">
    <div class="modal-background" onclick="closeModal('gameDetailsModal')"></div>
    <div class="modal-card modal-card-large" id="gameDetailsCard">
        <section class="modal-card-body p-0 overflow-y-auto" id="modalContent">
            <!-- Injected via JS -->
        </section>
    </div>
</div>

<!-- DLC Details Modal (New) -->
<div class="modal modal-dlc-details" id="dlcDetailsModal">
    <div class="modal-background" onclick="closeModal('dlcDetailsModal')"></div>
    <div class="modal-card modal-card-dlc">
        <header class="modal-card-head">
            <p class="modal-card-title is-size-5" id="dlcModalTitle">{{ t('modal.dlc_details_title') }}</p>
            <button class="delete" aria-label="close" onclick="closeModal('dlcDetailsModal')"></button>
        </header>
        <section class="modal-card-body p-0 overflow-y-auto" id="dlcModalContent">
            <!-- Injected via JS -->
        </section>
    </div>
</div>

<!-- Edit Metadata Modal -->
<div class="modal modal-edit-metadata" id="editMetadataModal">
    <div class="modal-background" onclick="closeModal('editMetadataModal')"></div>
    <div class="modal-card">
        <header class="modal-card-head">
            <p class="modal-card-title">{{ t('modal.edit_game_data') }}</p>
            <button class="delete" aria-label="close" onclick="closeModal('editMetadataModal')"></button>
        </header>
        <section class="modal-card-body">
            <!-- Search TitleDB Section -->
            <div class="box has-background-light-soft mb-4">
                <label class="label is-small">{{ t('modal.search_titledb_label') }}</label>
                <div class="field has-addons">
                    <div class="control is-expanded">
                        <input class="input is-small" type="text" id="searchTitleDBInput"
                            placeholder="{{ t('modal.search_titledb_placeholder') }}">
                    </div>
                    <div class="control">
                        <button class="button is-small is-info" onclick="searchTitleDB()">
                            <span class="icon is-small"><i class="bi bi-search"></i></span>
                            <span>{{ t('common.search') }}</span>
                        </button>
                    </div>
                </div>
                <div id="titleDBSearchResults" class="mt-2 title-db-results"></div>
            </div>

            <!-- Search RAWG Section -->
            <div class="box has-background-light-soft mb-4">
                <label class="label is-small">{{ t('modal.search_rawg_label') }}</label>
                <div class="field has-addons">
                    <div class="control is-expanded">
                        <input class="input is-small" type="text" id="searchRAWGInput"
                            placeholder="{{ t('modal.search_rawg_placeholder') }}">
                    </div>
                    <div class="control">
                        <button class="button is-small is-link" onclick="searchRAWG()">
                            <span class="icon is-small"><i class="bi bi-search"></i></span>
                            <span>{{ t('common.search') }}</span>
                        </button>
                    </div>
                </div>
                <div id="rawgSearchResults" class="mt-2 title-db-results"></div>
            </div>

            <input type="hidden" id="editMetaId">
            <input type="hidden" id="editMetaFullData">
            <div class="field">
                <label class="label">{{ t('common.name') }}</label>
                <div class="control">
                    <input class="input" type="text" id="editMetaName">
                </div>
            </div>
            <div class="field">
                <label class="label">{{ t('common.publisher') }}</label>
                <div class="control">
                    <input class="input" type="text" id="editMetaPublisher">
                </div>
            </div>
            <div class="field">
                <label class="label">{{ t('modal.description_label') }}</label>
                <div class="control">
                    <textarea class="textarea" id="editMetaDescription"></textarea>
                </div>
            </div>
            <div class="field">
                <label class="label">{{ t('modal.icon_url_label') }}</label>
                <div class="control">
                    <input class="input" type="text" id="editMetaIcon">
                </div>
            </div>
            <div class="field">
                <label class="label">{{ t('modal.banner_url_label') }}</label>
                <div class="control">
                    <input class="input" type="text" id="editMetaBanner">
                </div>
            </div>
            <div class="columns">
                <div class="column">
                    <div class="field">
                        <label class="label">{{ t('common.genre') }}</label>
                        <div class="control">
                            <input class="input" type="text" id="editMetaGenre" placeholder="{{ t('modal.genre_placeholder') }}">
                        </div>
                    </div>
                </div>
                <div class="column">
                    <div class="field">
                        <label class="label">{{ t('Data de Lançamento') }}</label>
                        <div class="control">
                            <input class="input" type="text" id="editMetaRelease" placeholder="Ex: 2023-11-14">
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <footer class="modal-card-foot is-justify-content-flex-end">
            <button class="button" onclick="closeModal('editMetadataModal')">{{ t('common.cancel') }}</button>
            <button class="button is-primary" id="btnSaveMetadata" onclick="saveGameMetadata()">{{ t('modal.save_changes') }}</button>
        </footer>
    </div>
</div>

<!-- Screenshot Modal -->
<div class="modal modal-screenshot" id="screenshotModal">
    <div class="modal-background" onclick="closeModal('screenshotModal')"></div>
    <div class="modal-content is-flex is-justify-content-center is-align-items-center p-0 modal-screenshot-content">
        <img id="screenshotModalImage" src="" alt="Screenshot" class="modal-screenshot-img">
    </div>
    <button class="modal-close is-large" aria-label="close" onclick="closeModal('screenshotModal')"></button>
</div>

<!-- Confirmation Modal (Generic) -->
<div class="modal modal-confirm" id="genericConfirmModal">
    <div class="modal-background" onclick="closeModal('genericConfirmModal')"></div>
    <div class="modal-card modal-card-confirm">
        <header class="modal-card-head py-3">
            <p class="modal-card-title is-size-6" id="confirmTitle">{{ t('modal.confirm_title') }}</p>
            <button class="delete" aria-label="close" onclick="closeModal('genericConfirmModal')"></button>
        </header>
        <section class="modal-card-body py-4">
            <div class="is-flex is-align-items-center mb-0">
                <span class="icon is-large has-text-warning mr-2">
                    <i class="bi bi-exclamation-triangle-fill is-size-3"></i>
                </span>
                <p id="confirmMessage" class="is-size-6">{{ t('modal.confirm_msg') }}</p>
            </div>
        </section>
        <footer class="modal-card-foot is-justify-content-flex-end py-2">
            <button class="button is-small is-light" onclick="closeModal('genericConfirmModal')">{{ t('common.cancel') }}</button>
            <button class="button is-small is-primary" id="btnConfirmAction">{{ t('modal.confirm_btn') }}</button>
        </footer>
    </div>
</div>

<!-- TitleDB JSON Modal -->
<div class="modal modal-titledb-json" id="titledbJsonModal">
    <div class="modal-background" onclick="closeModal('titledbJsonModal')"></div>
    <div class="modal-card" style="width: 800px; max-width: 95vw;">
        <header class="modal-card-head">
            <p class="modal-card-title">{{ t('modal.titledb_json_title') }}</p>
            <button class="delete" aria-label="close" onclick="closeModal('titledbJsonModal')"></button>
        </header>
        <section class="modal-card-body p-4">
            <div class="field">
                <div class="control">
                    <pre style="max-height: 60vh; overflow-y: auto; background-color: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 6px; font-family: monospace; font-size: 0.85rem;"><code id="titledbJsonContent"></code></pre>
                </div>
            </div>
        </section>
        <footer class="modal-card-foot is-justify-content-flex-end py-2">
            <button class="button is-small" onclick="closeModal('titledbJsonModal')">{{ t('common.close') }}</button>
        </footer>
    </div>
</div>

<script src="/static/js/modals.js?v={{ build_version }}"></script>
