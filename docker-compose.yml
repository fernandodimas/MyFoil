version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: myfoil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myfoil
      POSTGRES_PASSWORD: ${MYFOIL_DB_PASSWORD:-myfoilpassword}  # ⚠️ Change in production!
      POSTGRES_DB: myfoil
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfoil -d myfoil"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: myfoil-redis
    restart: unless-stopped
    volumes:
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  myfoil:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8465/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    container_name: myfoil
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - myfoil:latest
    restart: unless-stopped
    ports:
      - 8465:8465
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://myfoil:${MYFOIL_DB_PASSWORD:-myfoilpassword}@postgres:5432/myfoil
      - REDIS_URL=redis://redis:6379/0
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      # Memory optimization settings
      - DISABLE_LIBRARY_CACHE=true  # Don't cache full library in memory
      - LIBRARY_CACHE_MAX_SIZE=100  # If enabled, max titles to cache
      - WATCHDOG_INTERVAL=30  # Increase polling interval for large libraries
      - GUNICORN_WORKERS=1  # Single worker to minimize memory
    volumes:
      - /path/to/your/games:/games
      - /path/to/your/externo:/externo
      - ./config:/app/config
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    healthcheck:
      # Try celery ping first, fallback to checking process existence
      test: ["CMD-SHELL", "celery -A celery_app.celery inspect ping -d celery@$HOSTNAME || pgrep -f 'celery worker'"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

    container_name: myfoil-worker
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - myfoil:latest
    restart: unless-stopped
    # Use gevent pool since we are monkeypatching everything
    # Concurrency=1 to minimize memory (each greenlet can load TitleDB)
    # max-tasks-per-child=20 forces worker recycling to prevent memory leaks
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=1 -P gevent --max-tasks-per-child=20
    depends_on:
      redis:
        condition: service_healthy
      myfoil:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://myfoil:${MYFOIL_DB_PASSWORD:-myfoilpassword}@postgres:5432/myfoil
      - REDIS_URL=redis://redis:6379/0
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - CELERY_REQUIRED=true
      - USER_ADMIN_NAME=${USER_ADMIN_NAME:-admin}
      - USER_ADMIN_PASSWORD=${USER_ADMIN_PASSWORD:-admin}  # ⚠️ Change this in production!
    volumes:
      - /path/to/your/games:/games
      - /path/to/your/externo:/externo
      - ./config:/app/config
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  postgres_data:
